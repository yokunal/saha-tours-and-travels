<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Brand Icon Badge -->
  <g transform="translate(4, 8)">
    <!-- Shield / Hexagon subtle background -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#FFC20E" fill-opacity="0.15" stroke="#FFC20E" stroke-width="2"/>
    
    <!-- Mountain Peaks -->
    <path d="M10 46 L24 22 L36 42 L44 30 L54 46 Z" fill="#FFC20E" fill-opacity="0.28"/>
    <path d="M12 45 L24 24 L34 42" stroke="#FFC20E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 43 L44 31 L52 45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Car silhouette / Travel icon -->
    <path d="M14 48 C15 45 17 44 20 44 L44 44 C47 44 49 45 50 48 L53 53 C54 54 54 56 53 57 C52 58 51 58 49 58 L15 58 C13 58 12 58 11 57 C10 56 10 54 11 53 Z" fill="#FFC20E"/>
    <!-- Headlights -->
    <circle cx="18" cy="52" r="2.2" fill="#FFFFFF"/>
    <circle cx="46" cy="52" r="2.2" fill="#FFFFFF"/>
    <rect x="23" y="46" width="18" height="3" rx="1.5" fill="#18181B"/>
  </g>

  <!-- Typography -->
  <!-- SAHA -->
  <text x="82" y="38" font-family="'Archivo', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">SAHA</text>
  
  <!-- TOURS & TRAVELS -->
  <text x="83" y="58" font-family="'Figtree', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#FFC20E" letter-spacing="3.2">TOURS &amp; TRAVELS</text>

  <!-- Tagline divider & text -->
  <line x1="83" y1="65" x2="310" y2="65" stroke="#FFC20E" stroke-opacity="0.4" stroke-width="1"/>
  <text x="83" y="73" font-family="'Figtree', 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#E4E4E7" letter-spacing="1.8">CAR RENTAL &middot; HILL TOURS &middot; SILIGURI</text>
</svg>
